name: Build and push Docker image

# Builds the Sink image on GitHub (amd64) and pushes it to GitHub Container
# Registry (GHCR). Servers then just `docker compose pull && docker compose up -d`
# — they never build the image themselves (the Nuxt build needs ~8 GB RAM).
#
#   ghcr.io/<github-owner>/sink:latest      (built on every push to master)
#   ghcr.io/<github-owner>/sink:sha-<sha>   (per-commit, for rollback)
#   ghcr.io/<github-owner>/sink:<tag>       (on tags like v0.4.0)
#
# Optional: set a repo *variable* named REGISTRY (e.g. https://registry.npmmirror.com)
# if the default npm registry is slow/blocked for the Actions runner.
#
# After every master build this workflow prunes old GHCR versions, keeping the
# ~2 most recent builds. For the prune to work, link the package to this repo:
#   https://github.com/users/<owner>/packages/container/sink/settings
#   → "Link to a repository" → select this repo (needed once; the GITHUB_TOKEN
#     only manages packages that are linked to the repository).

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sink

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REGISTRY=${{ vars.REGISTRY }}

      # Keep GHCR tidy: delete versions older than the ~2 most recent builds.
      # Best-effort (never blocks the build). Requires the package to be linked
      # to this repository so GITHUB_TOKEN can manage it — see the header notes.
      - name: Prune old GHCR versions
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: sink
          package-type: container
          min-versions-to-keep: 6
